name: Sync semanal Brevo → HubSpot

# Brevo, una vez por semana. 20-25 minutos (~22.500 llamadas, una por contacto).
#
# ⚠️ Desde 2026-08-11 este workflow YA NO corre Circle: Circle se movió a
# `sync-diario.yml`. La corrida programada de acá es `--solo brevo`. Si necesitas las
# dos fuentes en una sola pasada, dispáralo a mano con `solo=ambas`.
#
# Reemplaza dos jobs de launchd que corrían en el Mac de Emilio y que fallaban en
# silencio: `com.procure.circle-hubspot-sync` venía muriendo desde el 2026-07-27 con
# "Operation not permitted" (macOS TCC no deja que launchd lea ~/Downloads sin Full
# Disk Access), y el de Brevo nunca alcanzó a correr programado.
#
# ⚠️ GitHub desactiva los workflows programados de un repo sin actividad de commits
# por 60 días. Lo previene `keep-alive.yml`; si igual pasa, lo detecta el dead-man's
# switch. No confíes en acordarte.

on:
  schedule:
    # Miercoles 11:23 UTC ≈ 07:23 en Chile (UTC-4).
    #
    # Por que miercoles y no lunes: el newsletter sale los MARTES. Con el cron en lunes
    # el sync corria el dia antes del envio, asi que las aperturas y clics de cada
    # campana esperaban 7 dias enteros para llegar a HubSpot. Miercoles las recoge ~24 h
    # despues del envio, que es donde ya cayo el grueso de la apertura.
    #
    # Por que el minuto 23 y no 0: con `0 11` las dos unicas corridas programadas
    # dispararon 6 h 28 min y 3 h 40 min tarde. El minuto 0 es el slot mas congestionado
    # del scheduler de GitHub. Un minuto impar ayuda; no garantiza nada.
    - cron: '23 11 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Calcular sin escribir en HubSpot'
        type: boolean
        default: false
      limite:
        description: 'Tope de contactos a escribir (vacío = todos)'
        type: string
        default: ''
      solo:
        description: 'Fuente a correr (la programada usa brevo; Circle va en sync-diario.yml)'
        type: choice
        options: ['brevo', 'circle', 'ambas']
        default: 'brevo'

# Mismo grupo que `sync-diario.yml` — los grupos son del REPO, no del workflow. Es lo
# que evita que un miércoles el diario de Circle y esta corrida escriban a la vez.
concurrency:
  group: sync-circle-brevo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # El sync hace ~22.500 llamadas a Brevo en paralelo: toma 20-25 min. El techo deja
    # aire para reintentos por rate limit sin quedarse colgado un día entero.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Resolver alcance
        # En una corrida programada `inputs.solo` viene vacío, y el default del input
        # sólo aplica a workflow_dispatch. Sin este paso el cron correría las DOS
        # fuentes y volvería a pisar a Circle todos los miércoles.
        run: |
          SOLO="${{ inputs.solo }}"
          [ -z "$SOLO" ] && SOLO="brevo"
          echo "SOLO=$SOLO" >> "$GITHUB_ENV"
          if [ "$SOLO" = "ambas" ]; then
            echo "ALCANCE=" >> "$GITHUB_ENV"
          else
            echo "ALCANCE=--solo $SOLO" >> "$GITHUB_ENV"
          fi
          echo "Alcance de esta corrida: $SOLO"

      - name: Sync → HubSpot
        env:
          # Los tokens llegan como variables de entorno reales; no hay .env en CI.
          # `load_env()` usa setdefault, así que estos ganan sobre cualquier archivo.
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CIRCLE_API_TOKEN: ${{ secrets.CIRCLE_API_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          ARGS="$ALCANCE"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limite }}" ]; then ARGS="$ARGS --limite ${{ inputs.limite }}"; fi
          echo "Corriendo: sync_circle_brevo.py $ARGS"
          python -u sync_circle_brevo.py $ARGS 2>&1 | tee logs/sync.log

      - name: Read-back en HubSpot
        # Guarda obligatoria: el sync puede terminar "verde" con lotes parcialmente
        # rechazados. Esto cuenta los contactos directamente en HubSpot en vez de
        # confiar en el log. Se salta en dry-run porque no se escribió nada.
        #
        # Va con el MISMO alcance que el sync: si esta corrida no tocó Circle, no puede
        # fallar por una señal de Circle.
        if: ${{ inputs.dry_run != true }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CIRCLE_API_TOKEN: ${{ secrets.CIRCLE_API_TOKEN }}
        run: |
          set -o pipefail
          python -u verificar_scoring.py $ALCANCE 2>&1 | tee logs/verificacion.log

      - name: Resumen en la corrida
        if: always()
        run: |
          {
            echo "## Sync semanal ($SOLO)"
            echo ""
            echo '```'
            tail -n 30 logs/sync.log 2>/dev/null || echo "(sin log de sync)"
            echo '```'
            echo ""
            echo "### Read-back"
            echo '```'
            tail -n 30 logs/verificacion.log 2>/dev/null || echo "(no corrió)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Latido (dead-man's switch)
        # Ninguna alerta dentro de GitHub Actions puede avisarte que GitHub no corrió.
        # Configurar en Healthchecks.io con period=7 days y grace=12 hours.
        if: success()
        env:
          URL: ${{ secrets.HEARTBEAT_SEMANAL_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::HEARTBEAT_SEMANAL_URL no está configurado — este sync NO tiene dead-man's switch."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$URL" > /dev/null && echo "Latido enviado."

      - name: Avisar a Slack si falló
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_URL no está configurado — la falla sólo se avisa por mail."
            exit 0
          fi
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '{"text":"🔴 Sync semanal (%s) → HubSpot FALLÓ. Revisar: %s"}' "$SOLO" "$RUN" \
            | curl -fsS -m 10 -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
          echo "Aviso enviado a Slack."

      - name: Guardar logs
        # `always()` para que los logs queden disponibles justo cuando la corrida falla,
        # que es cuando hacen falta.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
